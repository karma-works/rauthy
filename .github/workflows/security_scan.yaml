name: Security scan

# Known vulnerabilities in dependencies (osv-scanner: Cargo.lock, package-lock.json), leaked
# secrets (gitleaks), workflow weaknesses (zizmor) and the published image (trivy). Results go
# to the repository's code scanning alerts, which are the triage list; on PRs GitHub flags new
# alerts. A leaked secret fails the job. Binaries are pinned by version and SHA-256.
# See arztagent/SECURITY-AGENT.md.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_VERSION: '2.7.0'
  OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ZIZMOR_VERSION: '1.31.1'
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
  TRIVY_VERSION: '0.76.1'
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install scanners
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          get() { curl -sSfL --proto '=https' -o "$1" "$2" && echo "$3  $1" | sha256sum -c --quiet; }
          gh_rel=https://github.com
          get osv-scanner "$gh_rel/google/osv-scanner/releases/download/v$OSV_VERSION/osv-scanner_linux_amd64" "$OSV_SHA256"
          get gitleaks.tgz "$gh_rel/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
          get zizmor.tgz "$gh_rel/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256"
          get trivy.tgz "$gh_rel/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256"
          tar -xzf gitleaks.tgz gitleaks && tar -xzf zizmor.tgz zizmor && tar -xzf trivy.tgz trivy
          chmod +x osv-scanner gitleaks zizmor trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Dependencies (osv-scanner)
        run: |
          osv-scanner scan source -r --config osv-scanner.toml --format sarif --output osv.sarif . || [ $? -eq 1 ]
          osv-scanner scan source -r --config osv-scanner.toml --format table . || true
      - name: Secrets (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # PRs: the new commits. Otherwise the current tree (upstream's history holds old example keys).
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="$BASE..$HEAD" \
              --report-format sarif --report-path gitleaks.sarif .
          else
            gitleaks dir --redact --no-banner --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif .
          fi
      - name: Workflows (zizmor)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # Exit codes 10-14 mean findings (they go to code scanning), lower ones are errors.
        run: zizmor --format sarif .github/ > zizmor.sarif || [ $? -ge 10 ]
      - name: Published image (trivy)
        if: github.event_name != 'pull_request'
        run: |
          tag=$(python3 arztagent/upstream_sync.py image-tag --latest | head -1)
          echo "image ghcr.io/karma-works/rauthy:$tag"
          trivy image --quiet --format sarif --output trivy.sarif "ghcr.io/karma-works/rauthy:$tag"
          trivy image --quiet --severity HIGH,CRITICAL "ghcr.io/karma-works/rauthy:$tag" || true
      - name: Upload osv-scanner
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: Upload gitleaks
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload zizmor
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Upload trivy
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image
