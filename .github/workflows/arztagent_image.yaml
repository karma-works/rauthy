name: ArztAgent image

# Builds the multi-arch (amd64 + arm64) image of this fork and pushes it to
# ghcr.io/karma-works/rauthy:<tag>, the image ArztAgent pins by digest (ops/rauthy/IMAGE there).
# The digest is the manifest list, so Apple Silicon Macs pull the native arm64 image.
# Same builder container and UI build as "Code Style"; the steps follow `just build`: both
# binaries are built on x86 runners, arm64 is cross-compiled like upstream does.
# Runs by hand, and on every push to main that merges a PR labelled `upstream-sync` or
# `security` (tag <version>-aa<n+1>). ArztAgent's "Rauthy image bump" then opens its PR.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. 0.37.1-aa6 (empty: next free tag)'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arztagent-image
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security merge?
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          labels=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" \
            | python3 -c 'import json,sys; print(" ".join(l["name"] for p in json.load(sys.stdin) if p.get("merged_at") for l in p["labels"]))')
          echo "labels: $labels"
          case " $labels " in
            *" upstream-sync "*|*" security "*) echo "build=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Tag
        id: tag
        if: github.event_name == 'workflow_dispatch' || steps.merged.outputs.build == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            python3 arztagent/upstream_sync.py image-tag
          else
            echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-aa[0-9]+$' \
              || { echo "tag must look like 0.37.1-aa6" >&2; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  binary:
    name: Build release binary (${{ matrix.arch }})
    needs: decide
    if: needs.decide.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    timeout-minutes: 150
    container:
      image: ghcr.io/sebadob/rauthy-builder:20260519@sha256:6bea5d732ebfa4613c51a55c1c9c8b5c59dddfde9adbb6eca899d6599fd2b219
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select reviewed Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Build tools, WASM and UI
        run: |
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cp assets/build_tools/debian.sources /etc/apt/sources.list.d/debian.sources
          apt-get update --error-on=any
          apt-get upgrade -y --no-install-recommends
          apt-get install -y --no-install-recommends build-essential clang python3 patch \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          python3 assets/build_tools/builder_openssl.py
          python3 assets/build_tools/builder_cargo.py
          python3 assets/build_tools/install.py just wasm-pack wasm-bindgen-cli
          just build-wasm
          cd frontend
          npm ci
          cd ..
          just build-ui
          # Only add files the fresh UI build does not produce; never overwrite them.
          tar -xkzf assets/static_html/templates_html.tar.gz templates/ || true
          tar -xkzf assets/static_html/static_v1.tar.gz static/ || true
      - name: FIDO MDS dataset
        run: just fido-mds-prep
      - name: Release build
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          # Same as `just build`: 64 KiB jemalloc pages run on 4K (most arm64 Linux) and
          # 16K (Apple Silicon / Docker Desktop) kernels alike.
          if [ "$ARCH" = arm64 ]; then export JEMALLOC_SYS_WITH_LG_PAGE=16; fi
          cargo build --locked --release --target "$TARGET"
          mkdir -p out
          cp "target/$TARGET/release/rauthy" "out/rauthy_$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rauthy_${{ matrix.arch }}
          path: out/rauthy_${{ matrix.arch }}
          retention-days: 3

  image:
    name: Build and push image
    needs: [decide, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rauthy_*
          merge-multiple: true
          path: out
      - name: Build and push
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          chmod 0755 out/rauthy_amd64 out/rauthy_arm64
          mkdir -p out/empty
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg CREATED="$(date --rfc-3339=seconds)" \
            --build-arg VERSION="$TAG" \
            -t "ghcr.io/karma-works/rauthy:$TAG" \
            --metadata-file metadata.json \
            --push .
          digest=$(python3 -c "import json;print(json.load(open('metadata.json'))['containerimage.digest'])")
          echo "Image: ghcr.io/karma-works/rauthy@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
