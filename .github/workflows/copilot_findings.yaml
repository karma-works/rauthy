name: Copilot findings

# Open CodeQL alerts of this repository, with GitHub Copilot Autofix (free for public repos):
# Claude Code checks each finding and Copilot's fix, then accepts, improves or replaces the
# fix (PR, label security), dismisses a false positive (low/medium only) or asks a human in an
# issue (label security-decision). At most five alerts per run. See arztagent/SECURITY-AGENT.md.
#
# Trust split as in "Upstream sync": "check" runs repository code with Claude's key but no
# write token; "autofix" and "publish" hold the workflow token and run no repository code.

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Höchstzahl Alerts in diesem Lauf
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: copilot-findings
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: '2.1.301'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      security-events: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      agent: ${{ steps.agent.outputs.available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Agent available
        id: agent
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY$OAUTH" ]; then echo "available=true"; else echo "available=false"; fi >> "$GITHUB_OUTPUT"
      - name: Alerts to check
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '5' }}
        run: python3 arztagent/copilot_findings.py plan --max "$MAX"

  autofix:
    name: Copilot Autofix (alert ${{ matrix.item.alert }})
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Request the autofix and commit it to the alert branch
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ matrix.item.alert }}
        run: python3 arztagent/copilot_findings.py autofix --alert "$ALERT" --out "$RUNNER_TEMP/finding"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finding-${{ matrix.item.alert }}-autofix
          path: ${{ runner.temp }}/finding
          retention-days: 7

  check:
    name: Check (alert ${{ matrix.item.alert }})
    needs: [plan, autofix]
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/sebadob/rauthy-builder:20260519@sha256:6bea5d732ebfa4613c51a55c1c9c8b5c59dddfde9adbb6eca899d6599fd2b219
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: copilot-autofix/alert-${{ matrix.item.alert }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: finding-${{ matrix.item.alert }}-autofix
          path: ${{ runner.temp }}/finding
      - uses: ./.github/actions/builder-setup
      - name: Claude Code checks the finding and the fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ vars.UPSTREAM_SYNC_MODEL || 'opus' }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          python3 - "$RUNNER_TEMP/finding/alert.json" > "$RUNNER_TEMP/prompt.md" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))
          alert, autofix = record["alert"], record.get("autofix") or {}
          print(open("arztagent/copilot_findings_prompt.md").read())
          print("\n## This alert\n")
          print(json.dumps({k: alert.get(k) for k in ("number", "rule", "most_recent_instance", "tool")}, indent=2))
          print(f"\nCopilot Autofix status: {autofix.get('status')}")
          print(f"Copilot's description:\n{autofix.get('description') or '(none)'}")
          print(f"Autofix commit on this branch: {record.get('autofix_commit') or '(none)'}")
          PY
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" --model "$MODEL" --max-turns 200 \
            --allowedTools Bash Read Edit MultiEdit Write Glob Grep TodoWrite \
            --disallowedTools WebFetch WebSearch | tee "$RUNNER_TEMP/claude.log"
      - name: Commit and bundle
        run: python3 arztagent/copilot_findings.py finalize --out "$RUNNER_TEMP/finding"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finding-${{ matrix.item.alert }}
          path: ${{ runner.temp }}/finding
          retention-days: 7

  publish:
    name: Publish (alert ${{ matrix.item.alert }})
    needs: [plan, check]
    if: always() && needs.plan.outputs.count != '0' && needs.plan.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Keeps the workflow token for the push; this job uploads no artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download
        continue-on-error: true
        with:
          name: finding-${{ matrix.item.alert }}
          path: ${{ runner.temp }}/finding
      - name: PR, dismissal or issue
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT: ${{ matrix.item.alert }}
        run: |
          git fetch -q origin "copilot-autofix/alert-$ALERT" || true
          python3 arztagent/copilot_findings.py publish --out "$RUNNER_TEMP/finding" --run-url "$RUN_URL"
