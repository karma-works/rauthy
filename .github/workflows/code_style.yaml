name: Code Style

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.draft == false
    name: Check Code Style
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sebadob/rauthy-builder:20260519@sha256:6bea5d732ebfa4613c51a55c1c9c8b5c59dddfde9adbb6eca899d6599fd2b219
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select reviewed Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Setup && build UI
        run: |
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cp assets/build_tools/debian.sources /etc/apt/sources.list.d/debian.sources
          apt-get update --error-on=any
          apt-get upgrade -y --no-install-recommends
          apt-get install -y --no-install-recommends build-essential clang python3 patch
          python3 assets/build_tools/builder_openssl.py
          python3 assets/build_tools/builder_cargo.py
          python3 assets/build_tools/install.py just wasm-pack wasm-bindgen-cli
          just build-wasm
          
          cd frontend
          npm ci
          cd ..
          
          just build-ui
      - name: Code Format Backend
        run: cargo fmt --check
      - name: Code Style Backend
        run: cargo clippy --locked -- -D warnings
      - name: Code Format UI
        working-directory: ./frontend
        run: npm run format-check
      - name: Code Style UI
        working-directory: ./frontend
        run: npm run check
      - name: Frontend Contract Tests
        working-directory: ./frontend
        run: npm run test:webauthn
        # The Chromium reset-page tests (npm run test:password-reset and
        # npm run test:new-user-passkey) are not
        # wired here: they need a browser binary plus the already-built
        # frontend. Run them locally after `just build-ui`.
