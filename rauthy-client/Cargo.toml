[package]
name = "rauthy-client"
version = "0.15.1"
edition = "2024"
authors = ["Sebastian Dobe <sebastiandobe@mailbox.org>"]
license = "Apache-2.0"
rust-version = "1.90.0"
categories = ["web-programming"]
keywords = ["rauthy", "rauthy-client", "oidc"]
description = "Client for the Rauthy OIDC IAM project"
repository = "https://github.com/sebadob/rauthy/tree/main/rauthy-client"

[package.metadata.docs.rs]
all-features = false
features = ["backchannel-logout", "device-code", "scim", "userinfo"]

[features]
default = []

actix-web = [
    "dep:actix-web",
]
axum = [
    "dep:axum",
    "dep:axum-extra",
    "dep:time",
]
backchannel-logout = []
device-code = []
qrcode = ["device-code", "dep:qrcode"]
rsa = ["dep:ring"]
scim = ["dep:constant_time_eq"]
userinfo = []

[dependencies]
# common
arc-swap = "1.9"
base64 = "0.23"
bincode-next = { version = "3.1.1", features = ["derive", "serde"] }
chacha20poly1305 = { version = "0.11", features = ["rand_core", "zeroize"] }
chrono = { version = "0.4.31", default-features = false, features = ["clock", "serde", "std"] }
constant_time_eq = { version = "0.6.1", optional = true }
ed25519-compact = "2.2"
http = "1"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli", "form", "json", "rustls"
] }
ring = { version = "0.17.14", optional = true }
serde = { version = "1.0.180", features = ["derive"] }
serde_json = "1.0.100"
sha2 = "0.10.9"
thiserror = { version = "2" }
tokio = { version = "1.34", features = ["macros"] }
tracing = "0.1.40"

# actix-web
actix-web = { version = "4.15", optional = true, default-features = false, features = ["cookies"] }

# axum
axum = { version = "0.8", optional = true, features = [] }
axum-extra = { version = "0.12.2", optional = true, features = ["cookie", "typed-header"] }
# necessary to fix a vulnerability
time = { version = "0.3.47", optional = true }

# device-code
qrcode = { version = "0.14.0", optional = true }
